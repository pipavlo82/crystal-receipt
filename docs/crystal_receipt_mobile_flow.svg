<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 900 960" role="img" aria-labelledby="title desc">
  <title id="title">ReceiptOS recomputable evidence and verifier-conformance architecture</title>
  <desc id="desc">Supplied evidence becomes a recomputable receipt. Receipt evaluation and verifier-conformance evaluation remain distinct, and downstream consumers interpret their findings.</desc>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="960" fill="#ffffff"/>

  <!-- Header -->
  <text x="450" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#111111">RECEIPTOS</text>
  <text x="450" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="500" fill="#333333">Recomputable evidence and verifier conformance</text>

  <!-- Block 1: Supplied evidence -->
  <rect x="90" y="118" width="720" height="108" rx="22" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="450" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#111111">Supplied evidence</text>
  <text x="450" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="500" fill="#333333">agents · workflows · CI · tools · runtimes</text>

  <path d="M450 238 L450 278" stroke="#111111" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Block 2: Recomputable receipt -->
  <rect x="90" y="288" width="720" height="138" rx="24" fill="#f2f8ff" stroke="#111111" stroke-width="3"/>
  <text x="450" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#111111">Recomputable receipt</text>
  <text x="450" y="372" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#111111">receipt_root · Evidence Capsule · portable proof</text>
  <text x="450" y="404" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#444444">Declared properties are recomputed from supplied evidence.</text>

  <!-- Split to two planes -->
  <path d="M270 438 L270 478" stroke="#111111" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M630 438 L630 478" stroke="#111111" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Plane A: Receipt evaluation -->
  <rect x="50" y="488" width="380" height="178" rx="22" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="240" y="535" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#111111">Receipt evaluation</text>
  <text x="240" y="580" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#111111">stored ↔ computed</text>
  <text x="240" y="620" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#333333">verified · mismatch</text>
  <text x="240" y="645" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#333333">missing / unresolved</text>

  <!-- Plane B: Verifier conformance -->
  <rect x="470" y="488" width="380" height="178" rx="22" fill="#f7f7f7" stroke="#111111" stroke-width="3"/>
  <text x="660" y="535" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#111111">Verifier conformance</text>
  <text x="660" y="575" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#111111">RSF · DCN · traversal stability</text>
  <rect x="500" y="598" width="140" height="44" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="570" y="627" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111111">DCN 10 / 10</text>
  <rect x="660" y="598" width="160" height="44" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="740" y="627" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111111">stability 50 / 50</text>

  <!-- Converge -->
  <path d="M240 676 L240 708 L450 708" stroke="#111111" stroke-width="2.5" fill="none"/>
  <path d="M660 676 L660 708 L450 708" stroke="#111111" stroke-width="2.5" fill="none"/>
  <path d="M450 708 L450 742" stroke="#111111" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Block 4: Downstream interpretation -->
  <rect x="90" y="752" width="720" height="118" rx="24" fill="#f6fff2" stroke="#111111" stroke-width="3"/>
  <text x="450" y="795" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#111111">Downstream interpretation</text>
  <text x="450" y="830" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#111111">Chronicle · Viewer · Policy · Export</text>
  <text x="450" y="858" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="500" fill="#444444">Consumers decide admission, history, policy, or judgment.</text>

  <!-- Bottom boundary: one conceptual line, two visual rows for phone width -->
  <text x="450" y="910" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#111111">source validity ≠ verifier conformance</text>
  <text x="450" y="938" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#111111">≠ downstream judgment</text>
</svg>
